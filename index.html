let cur=0,scores={NS:0,HA:0,SD:0,C:0};
function startTest(){document.getElementById('intro').style.display='none';document.getElementById('test').style.display='block';showQ(0);}
function showQ(i){
  const q=Qs[i];
  document.getElementById('q-num').textContent=(i+1)+' / '+Qs.length;
  document.getElementById('dim-label').textContent=q.dim;
  document.getElementById('prog').style.width=((i+1)/Qs.length*100)+'%';
  document.getElementById('q-icon').textContent=q.icon;
  document.getElementById('q-text').textContent=q.text;
  const el=document.getElementById('options');el.innerHTML='';
  q.opts.forEach((o,j)=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.innerHTML='<span class="opt-label">'+'ABCD'[j]+'</span><span>'+o.t+'</span>';
    b.onclick=()=>answer(o.s);
    el.appendChild(b);
  });
}
function answer(s){Object.keys(s).forEach(k=>scores[k]=(scores[k]||0)+s[k]);cur++;if(cur<Qs.length){showQ(cur);}else{showResult();}}
function dist(a,b){return Math.sqrt(['NS','HA','SD','C'].reduce((acc,k)=>{const d=(a[k]||0)-(b[k]||0);return acc+d*d;},0));}
function showResult(){
  document.getElementById('test').style.display='none';
  const norm={NS:scores.NS/20*10,HA:scores.HA/20*10,SD:scores.SD/20*10,C:scores.C/20*10};
  let best=EMPERORS[0],bd=999;
  EMPERORS.forEach(e=>{const d=dist(norm,e.profile);if(d<bd){bd=d;best=e;}});
  document.getElementById('r-name').textContent=best.name;
  document.getElementById('r-subtitle').textContent=best.subtitle;
  document.getElementById('r-desc').textContent=best.desc;
  document.getElementById('card-oneline').textContent='"'+best.oneline+'"';
  const tr=document.getElementById('card-traits');tr.innerHTML='';
  best.traits.forEach(t=>{const s=document.createElement('span');s.className='trait-tag';s.textContent=t;tr.appendChild(s);});
  const bars=document.getElementById('card-bars');bars.innerHTML='';
  if(best.sims){
    best.sims.forEach((s,i)=>{
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;';
      row.innerHTML='<span style="font-size:13px;color:#EF9F27;flex-shrink:0;margin-top:1px;">'+(i+1)+'.</span><span style="font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;">'+s+'</span>';
      bars.appendChild(row);
    });
  }
  document.getElementById('result').style.display='block';
}

body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #fff; color: #1a1a1a; }

.card-bar-label { font-size: 11px; color: rgba(255,255,255,0.45); min-width: 52px; }

.card-oneline { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.65; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; font-style: italic; }
.desc-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
.desc-label { font-size: 12px; color: #888; font-weight: 500; margin-bottom: 0.6rem; letter-spacing: 0.04em; }
.desc-text { font-size: 14px; color: #555; line-height: 1.75; }
.btn-row { display: flex; gap: 8px; }
.btn-secondary { flex: 1; padding: 12px; font-size: 14px; background: #f5f5f5; color: #333; border: 1px solid #ddd; border-radius: 10px; }
.btn-primary { flex: 1; padding: 12px; font-size: 14px; background: #BA7517; color: #fff; border: none; border-radius: 10px; }

<body>
<div class="wrap">

<div id="intro">

</div>

  {name:"키루스 대왕",subtitle:"페르시아의 인권 선구자 · BC 559–530",profile:{NS:5,HA:4,SD:8,C:9},oneline:"역사 최초의 인권 선언문을 남긴, 강하지만 결코 잔인하지 않은 리더.",desc:"따뜻한 공감력과 강인한 자율성이 공존하는 당신. 원칙을 지키면서도 타인의 존엄을 존중한 키루스의 기질이 당신 안에 있습니다.",traits:["인도주의적 원칙","타인 존중","강인한 자율성","공정한 판단"]},
  {name:"율리우스 카이사르",subtitle:"로마의 카리스마 혁명가 · BC 49–44",profile:{NS:9,HA:2,SD:7,C:3},oneline:"주사위는 던져졌다 — 결정적 순간에 두려움 없이 도약하는 타고난 개척자.",desc:"끊임없이 새로운 자극을 추구하고 두려움을 모르는 당신. 결정적 순간에 누구보다 먼저 과감하게 도약하는 개척정신의 소유자입니다.",traits:["과감한 모험심","강렬한 카리스마","빠른 직관","개혁적 본능"]},
  {name:"만사 무사",subtitle:"말리의 황금 황제 · 1312–1337",profile:{NS:5,HA:5,SD:7,C:9},oneline:"역사상 최고 부자였지만 그 부를 민중과 예술에 쏟아부은, 나눔이 본능인 황제.",desc:"넘치는 것을 나누는 것이 자연스러운 당신. 공감력이 리더십의 핵심인 만사 무사처럼, 공동체의 풍요를 개인의 성공보다 더 중요하게 여깁니다.",traits:["관대한 나눔","공동체 중심","예술과 교육 애정","균형 잡힌 지혜"]},
  {name:"악숨 에자나 왕",subtitle:"아프리카 강국의 개혁가 · 320–360",profile:{NS:4,HA:5,SD:7,C:9},oneline:"화려하지 않지만 진심으로 — 조용한 신념으로 제국을 통합한 개혁가.",desc:"조용하지만 깊은 신념으로 세상을 바꾸는 당신. 화려하지 않지만 진심 어린 공감력과 신중성으로 공동체를 이끄는 힘을 가지고 있습니다.",traits:["신중한 신념","통합적 리더십","공동체 헌신","조용한 개혁"]}
];
let cur=0,scores={NS:0,HA:0,SD:0,C:0};
function startTest(){document.getElementById('intro').style.display='none';document.getElementById('test').style.display='block';showQ(0);}
function showQ(i){
  const q=Qs[i];
  document.getElementById('q-num').textContent=(i+1)+' / '+Qs.length;
  document.getElementById('dim-label').textContent=q.dim;
  document.getElementById('prog').style.width=((i+1)/Qs.length*100)+'%';
  document.getElementById('q-icon').textContent=q.icon;
  document.getElementById('q-text').textContent=q.text;
  const el=document.getElementById('options');el.innerHTML='';
  q.opts.forEach((o,j)=>{
    const b=document.createElement('button');
    b.className='opt-btn';
    b.innerHTML='<span class="opt-label">'+'ABCD'[j]+'</span><span>'+o.t+'</span>';
    b.onclick=()=>answer(o.s);
    el.appendChild(b);
  });
}
function answer(s){Object.keys(s).forEach(k=>scores[k]=(scores[k]||0)+s[k]);cur++;if(cur<Qs.length){showQ(cur);}else{showResult();}}
function dist(a,b){return Math.sqrt(['NS','HA','SD','C'].reduce((acc,k)=>{const d=(a[k]||0)-(b[k]||0);return acc+d*d;},0));}
function showResult(){
  document.getElementById('test').style.display='none';
  const norm={NS:scores.NS/20*10,HA:scores.HA/20*10,SD:scores.SD/20*10,C:scores.C/20*10};
  let best=EMPERORS[0],bd=999;
  EMPERORS.forEach(e=>{const d=dist(norm,e.profile);if(d<bd){bd=d;best=e;}});
  document.getElementById('r-name').textContent=best.name;
  document.getElementById('r-subtitle').textContent=best.subtitle;
  document.getElementById('r-desc').textContent=best.desc;
  document.getElementById('card-oneline').textContent='"'+best.oneline+'"';
  const tr=document.getElementById('card-traits');tr.innerHTML='';
  best.traits.forEach(t=>{const s=document.createElement('span');s.className='trait-tag';s.textContent=t;tr.appendChild(s);});
  const bars=document.getElementById('card-bars');bars.innerHTML='';
  DIMS.forEach(d=>{
    const v=Math.round((scores[d.k]||0)/20*100);
    const row=document.createElement('div');row.className='card-bar-row';
    row.innerHTML='<span class="card-bar-label">'+d.label+'</span><div class="card-bar-track"><div class="card-bar-fill" style="width:'+v+'%;background:'+d.color+';"></div></div><span class="card-bar-val">'+v+'%</span>';
    bars.appendChild(row);
  });
  document.getElementById('result').style.display='block';
}
function shareKakao(){
  const name=document.getElementById('r-name').textContent;
  alert('결과: '+name+'\n\n링크를 복사해서 친구에게 공유해보세요! 👑');
}
function restart(){cur=0;scores={NS:0,HA:0,SD:0,C:0};document.getElementById('result').style.display='none';document.getElementById('intro').style.display='block';}
</script>
